{% extends "contenido/barraNav.html" %}

{%block titulo%}
Solicitud de curso
{%endblock%}

{% block contenido %}
<section class = "seccion_form">
    <form class = "form_seleccion">
        <div class = "cursos">
            <h2>Selecciona tu Curso</h2>
        </div>
        <div class = "campos">
            <label for = "nombre">Nombre</label>
            <input type = "text" name = "nombre" id = "nombre" placeholder = "Nombre"/>
            <label for = "correo">Correo electrónico</label> 
            <input type = "text" name = "correo" name = "correo" id = "correo" placeholder = "Correo"/>
            <label for = "curso">Curso</label>
            <select class = "select_option">
                <option name = "option" selected disabled hidden>Seleccione una opción</option>
                <option name = "option">Base de datos</option>
                <option name = "option">Programacion</option>
                <option name = "option">IoT</opcion>
            </select>
            <label for = "mensaje">Mensaje</label>
            <textarea cols = "50" rows = "10" type = "text" name = "mensaje" name = "mensaje" id = "mensaje" placeholder = "Mensaje"></textarea>
            <p><input type = "button" class = "btn" name = "enviar" value = "Enviar" /></p>
        </div>
        
    </form>
</section>
{% endblock %}
